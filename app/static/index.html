<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f9" id="themeColor">
<script>
// Appliqué avant le rendu pour éviter un flash de mauvais thème
function applyTheme() {
  let t = {}; try { t = JSON.parse(localStorage.getItem("pvehub.theme")) || {}; } catch {}
  const r = document.documentElement, dark = t.mode === "dark" || (t.mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.mode = dark ? "dark" : "light";
  r.dataset.accent = t.accent || "blue";
  r.dataset.bg = t.bg || "system";
  requestAnimationFrame(() => document.getElementById("themeColor").content = getComputedStyle(r).backgroundColor);
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PVE Hub">
<title>PVE Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg?v=2">
<link rel="apple-touch-icon" href="/icon.png?v=2">
<style>
:root{
  --bg:#eef3f9;--card:#fff;--card2:#e3eaf3;--label:#0f1e33;--label2:rgba(15,30,51,.62);--label3:rgba(15,30,51,.3);
  --sep:rgba(15,30,51,.16);--fill:rgba(15,30,51,.07);--fill2:rgba(15,30,51,.14);
  --blue:#0866d0;--green:#30d158;--green-text:#157a36;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--teal:#30b0c7;--indigo:#5856d6;--gray:#8e8e93;--pink:#ff2d55;
  --bar:rgba(238,243,249,.86);--bubble:#dde6f1;--code:#e3eaf3;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
/* le mode effectif (auto/clair/sombre) est posé en JS sur <html data-mode> */
:root[data-mode=dark]{
  --bg:#0f1e33;--card:#2c2c2e;--card2:#3a3a3c;--label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);
  --sep:rgba(255,255,255,.12);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.34);
  --blue:#4da3ff;--green:#30d158;--green-text:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;--indigo:#5e5ce6;--gray:#98989d;--pink:#ff375f;
  --bar:rgba(15,30,51,.86);--bubble:#2c2c2e;--code:#1c2c44;
}
/* couleur d'accent */
:root{--accent:var(--blue);--on-accent:#fff}
:root[data-mode=dark][data-accent=blue]{--on-accent:#0f1e33}  /* blanc sur #4da3ff : 2,6:1, illisible */
:root[data-accent=indigo]{--accent:var(--indigo)}:root[data-accent=purple]{--accent:var(--purple)}:root[data-accent=pink]{--accent:var(--pink)}
:root[data-accent=red]{--accent:var(--red)}:root[data-accent=orange]{--accent:var(--orange)}:root[data-accent=green]{--accent:var(--green)}:root[data-accent=teal]{--accent:var(--teal)}
:root[data-accent=mono]{--accent:#000;--on-accent:#fff}:root[data-mode=dark][data-accent=mono]{--accent:#fff;--on-accent:#000}
:root[data-accent=mono] .ico{background:var(--gray)!important}
/* fond */
:root[data-bg=tint]{--bg:color-mix(in srgb,var(--accent) 9%,#eef3f9)}
:root[data-mode=dark][data-bg=tint]{--bg:color-mix(in srgb,var(--accent) 16%,#0f1e33)}
:root[data-bg=contrast]{--bg:#fff;--card:#eef3f9;--card2:#e3eaf3}
:root[data-mode=dark][data-bg=contrast]{--bg:#2c2c2e;--card:#0f1e33;--card2:#1c2c44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:17px/1.3 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
*{touch-action:manipulation}
input,select,textarea{font-size:max(16px,1em)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;letter-spacing:inherit}
input,textarea,select{font:inherit;color:var(--label);letter-spacing:inherit}
.hide{display:none!important}
.mute{color:var(--label2)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}

/* barre de navigation */
.navbar{position:sticky;top:0;z-index:20;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;
  background:transparent;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.navbar .nt{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none}
.navbar.scrolled .nt{opacity:1}
.navbar .side{min-width:80px;display:flex;align-items:center;z-index:1}
.navbar .side.r{justify-content:flex-end;margin-left:auto}
.navbtn{color:var(--accent);font-size:17px;padding:8px;display:flex;align-items:center;gap:2px}
.navbtn svg{width:24px;height:24px}
.large{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 16px 8px;line-height:1.2}
.sub{margin:-4px 16px 12px;font-size:15px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--label2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.live.off i{background:var(--red)}

main{padding-bottom:calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* barre d'onglets */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:7px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--gray)}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:26px;height:26px}

/* listes groupées */
.hdr{font-size:13px;color:var(--label2);text-transform:uppercase;margin:22px 32px 7px;letter-spacing:0;display:flex;align-items:flex-end}
.hdr .grow{min-width:0}
.hdr button{color:var(--accent);text-transform:none;font-size:15px}
.ftr{font-size:13px;color:var(--label2);margin:7px 32px 0;line-height:1.35}
.group{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%;text-align:left}
.cell::after{content:"";position:absolute;right:0;bottom:0;left:var(--inset,16px);border-bottom:.5px solid var(--sep)}
.cell:last-child::after{display:none}
.cell.icon{--inset:60px}
.cell .body{flex:1;min-width:0;padding:11px 0}
.cell .t{font-size:17px}
.cell .s{font-size:13px;color:var(--label2);margin-top:2px}
.cell .v{color:var(--label2);font-size:17px;text-align:right;flex:none}
.tap:active{background:var(--fill)}
.chev{width:8px;height:13px;flex:none;color:var(--label3)}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:19px;height:19px}
.cell.act{color:var(--accent)}
.cell.act.danger{color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex:none}
.dot.running,.dot.online{background:var(--green)}.dot.paused{background:var(--orange)}
.pill{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--label2);flex:none}
.bar{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .5s}
.bar i.hi{background:var(--orange)}.bar i.crit{background:var(--red)}

/* tuiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px 14px;text-align:left}
.tile .k{font-size:13px;font-weight:600;color:var(--label2);display:flex;align-items:center;gap:6px}
.tile .k svg{width:16px;height:16px}
.tile .n{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.tile .n small{font-size:15px;font-weight:500;color:var(--label2)}

canvas{width:100%;height:120px;display:block}
.chartbox{padding:12px 16px 14px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--label2);margin-bottom:8px;align-items:center}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* contrôle segmenté + recherche */
.search{margin:0 16px 10px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px}
.search svg{width:16px;height:16px;color:var(--label2);flex:none}
.search input{flex:1;border:0;background:none;outline:0;font-size:17px;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 16px 14px}
.seg button{flex:1;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-mode=dark] .seg button.on{background:#636366}

/* actions machine */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 16px}
.actions button{background:var(--card);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.actions button svg{width:24px;height:24px}
.actions button:disabled{opacity:.35}
.actions .go{color:var(--green)}.actions .pw{color:var(--orange)}.actions .rb{color:var(--blue)}.actions .kill{color:var(--red)}

/* vue détail (poussée depuis la droite) */
.push{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
.push.open{transform:none;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.push{padding-inline:max(0px,calc((100% - 720px) / 2))}
.tfsel{display:flex;gap:2px;background:var(--fill);border-radius:8px;padding:2px}
.tfsel button{font-size:12px;padding:3px 8px;border-radius:6px;color:var(--label2);min-height:24px}
.tfsel button.on{background:var(--card);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#nav{padding-inline:max(8px,calc((100% - 720px) / 2 + 8px))}.tabbar{padding-inline:max(0px,calc((100% - 720px) / 2))}
@media (min-width:700px){.modal{align-items:center}.card-sheet{border-radius:14px;max-height:85vh}}
.push .navbar{position:sticky}

/* feuilles modales */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal.center{align-items:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{transform:scale(1.1);opacity:0}}
.sheet-as{width:100%;max-width:500px;padding:0 8px calc(8px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
.as-g{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.as-title{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep);line-height:1.35}
.as-title b{display:block;color:var(--label2);font-weight:600;margin-bottom:2px}
.as-btn{display:block;width:100%;height:57px;font-size:20px;color:var(--accent);border-bottom:.5px solid var(--sep)}
.as-btn:last-child{border-bottom:0}
.as-btn.danger{color:var(--red)}
.as-btn.cancel{background:var(--card);border-radius:14px;font-weight:600}
.alert{width:270px;background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;animation:pop .2s;text-align:center}
.alert .ab{padding:19px 16px 15px}
.alert h3{margin:0 0 4px;font-size:17px;font-weight:600}
.alert p{margin:0 0 10px;font-size:13px}
.alert input,.alert select{width:100%;margin-top:8px;padding:7px 8px;font-size:16px;border:.5px solid var(--sep);border-radius:7px;background:var(--card);outline:0}
.alert .af{display:block;text-align:left;font-size:13px;color:var(--label2);margin-top:10px}.alert .af input{margin-top:3px;color:var(--label)}
.alert p a{color:var(--accent)}
.alert .abtns{display:flex;border-top:.5px solid var(--sep)}
.alert .abtns button{flex:1;height:44px;color:var(--accent);font-size:17px}
.alert .abtns button+button{border-left:.5px solid var(--sep);font-weight:600}
.card-sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:12px 12px 0 0;padding-bottom:calc(30px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.8,.2,1)}
.card-sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.card-sheet .shead{display:flex;align-items:center;padding:12px 16px 4px}
.card-sheet .shead h2{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}

/* interrupteur iOS */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--fill2);border-radius:16px;transition:background .25s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(20px)}

/* mes apps : grille façon écran d'accueil */
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:18px 8px;margin:4px 16px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--label);position:relative;min-width:0}
.app .ai{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;font-size:26px;font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.app .ai img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:11px;background:#fff;opacity:0}
.app .ai img.ok{opacity:1}.app .ai img[src^="/icon.png"]{padding:0}
.app .an{font-size:12px;text-align:center;width:100%;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.app .st{position:absolute;top:-3px;right:calc(50% - 37px);width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);background:var(--gray)}
.app .st.up{background:var(--green)}.app .st.down{background:var(--red)}
.app.hid{opacity:.4}
.app.add .ai{background:var(--fill);color:var(--accent);box-shadow:none;font-size:34px;font-weight:300}
.appgrid.edit .app:not(.add) .ai{animation:wiggle .3s ease-in-out infinite alternate}
.appgrid.edit .app:nth-child(even) .ai{animation-delay:-.15s}
@keyframes wiggle{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.appgrid.edit .app .ai{animation:none}}

.badge{position:absolute;top:6px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg)}

/* réglages d'apparence */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;padding:14px 16px}
.swatch{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;justify-self:center;border:3px solid transparent}
.swatch.on{border-color:var(--label3)}
.swatch i{width:28px;height:28px;border-radius:50%;display:block}
.swatch i[data-c=blue]{background:var(--blue)}.swatch i[data-c=indigo]{background:var(--indigo)}.swatch i[data-c=purple]{background:var(--purple)}
.swatch i[data-c=pink]{background:var(--pink)}.swatch i[data-c=red]{background:var(--red)}.swatch i[data-c=orange]{background:var(--orange)}
.swatch i[data-c=green]{background:var(--green)}.swatch i[data-c=teal]{background:var(--teal)}
.swatch i[data-c=mono]{background:linear-gradient(135deg,#000 50%,#fff 50%);box-shadow:inset 0 0 0 1px var(--sep)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}
.bgopt{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.bgopt .pv{width:100%;height:74px;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;gap:6px;padding:10px;background:#eef3f9}
.bgopt.on .pv{border-color:var(--accent)}
.bgopt .pv b{height:14px;border-radius:4px;background:#fff}
.pv[data-pv=tint]{background:color-mix(in srgb,var(--accent) 9%,#eef3f9)!important}
.pv[data-pv=contrast]{background:#fff!important}.pv[data-pv=contrast] b{background:#eef3f9!important}
:root[data-mode=dark] .bgopt .pv{background:#0f1e33}:root[data-mode=dark] .bgopt .pv b{background:#2c2c2e}
:root[data-mode=dark] .pv[data-pv=tint]{background:color-mix(in srgb,var(--accent) 16%,#0f1e33)!important}
:root[data-mode=dark] .pv[data-pv=contrast]{background:#2c2c2e!important}:root[data-mode=dark] .pv[data-pv=contrast] b{background:#0f1e33!important}

/* bannières */
.toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;padding:0 12px}
.toast{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);color:var(--label);padding:12px 16px;border-radius:16px;font-size:15px;font-weight:500;
  max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:drop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-120%)}}

/* commandes */
.term{display:block;width:100%;min-height:88px;resize:none;border:0;outline:0;background:none;padding:12px 16px;font:16px/1.4 var(--mono);color:var(--label)}
.picker{appearance:none;-webkit-appearance:none;border:0;background:none;outline:0;color:var(--label2);font-size:17px;text-align:right;direction:rtl;max-width:60%;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border-radius:16px;padding:7px 13px;font:13px var(--mono);white-space:nowrap;flex:none}
.out{margin:0;padding:10px 16px 14px;font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto;color:var(--label)}
.code-ok{color:var(--green-text);font-weight:600}.code-bad{color:var(--red);font-weight:600}
.bigbtn{display:block;margin:12px 16px 0;width:calc(100% - 32px);height:50px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600}
.bigbtn:disabled{opacity:.5}

/* chat */
#chat{display:flex;flex-direction:column;gap:4px;padding:0 12px 80px}
.msg{max-width:80%;padding:8px 13px;border-radius:19px;word-wrap:break-word;font-size:17px;line-height:1.32}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);margin-top:6px}
.msg.assistant{align-self:flex-start;background:var(--bubble);margin-top:6px}
.msg.note{align-self:center;font-size:12px;color:var(--label2);background:none;text-align:center;padding:6px 10px;max-width:90%}
.msg pre{background:var(--code);padding:8px 10px;border-radius:10px;overflow-x:auto;font:12px/1.4 var(--mono);margin:6px 0}
.msg code{font:14px var(--mono);background:var(--code);padding:1px 4px;border-radius:5px}
.msg.user code{background:rgba(255,255,255,.2)}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.tools span{font-size:12px;color:var(--label2);background:var(--card);padding:2px 8px;border-radius:9px;display:inline-flex;align-items:center;gap:4px}
.inline{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0 4px}
.inline .it{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.inline .is{font-size:13px;color:var(--label2);margin-top:3px}
.inline pre{margin:8px 0 0}
.ibtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ibtn{flex:1 1 auto;min-width:46%;height:36px;border-radius:9px;background:var(--fill);color:var(--accent);font-size:15px;font-weight:600}
.ibtn.pri{background:var(--accent);color:var(--on-accent)}
.ibtn.no{color:var(--red)}
.done{font-size:13px;color:var(--green-text);font-weight:600;margin-top:8px}
.done.no{color:var(--red)}
.composer{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));z-index:19;padding:6px 10px;display:flex;gap:8px;align-items:flex-end;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.composer textarea{flex:1;resize:none;height:36px;max-height:120px;border-radius:18px;padding:7px 14px;border:.5px solid var(--sep);background:var(--card);outline:0;font-size:17px;line-height:1.3}
.send{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;margin-bottom:2px}
.send:disabled{background:var(--fill2)}
.send svg{width:18px;height:18px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--label3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{30%{background:var(--label2)}}
.empty{text-align:center;color:var(--label2);padding:40px 24px;font-size:15px}
.empty .chip{display:inline-block;margin:6px 4px 0;font-family:var(--font);font-size:15px;color:var(--accent)}

#login{max-width:340px;margin:0 auto;padding:calc(18vh + env(safe-area-inset-top)) 16px 0;text-align:center}
#login .logo{width:84px;height:84px;border-radius:20px;margin-bottom:14px}
#login h1{font-size:28px;margin:0 0 24px}
#login input{width:100%;height:50px;border-radius:12px;border:0;background:var(--card);padding:0 16px;outline:0;font-size:17px}
#login .bigbtn{margin:12px 0 0;width:100%}

/* style « carré, ombre floue légère » */
:root{--edge:rgba(15,30,51,.10);--soft:0 6px 20px rgba(15,30,51,.07)}
:root[data-mode=dark]{--edge:rgba(255,255,255,.08);--soft:0 8px 24px rgba(0,0,0,.28)}
.group,.tile,.actions button{border-radius:6px;box-shadow:0 0 0 1px var(--edge),var(--soft)}
.inline,.chip{border-radius:6px;box-shadow:0 0 0 1px var(--edge)}
.bigbtn,.ibtn{border-radius:4px}
.seg,.tfsel,.search{border-radius:5px}
.seg button,.tfsel button{border-radius:3px}
.seg button.on,.tfsel button.on{box-shadow:0 0 0 1px var(--edge)}
.ico{border-radius:4px}
.app .ai{border-radius:10px;box-shadow:0 0 0 1px var(--edge)}
.app.add .ai{box-shadow:none}
.msg{border-radius:10px}.msg.user{border-bottom-right-radius:2px}.msg.assistant{border-bottom-left-radius:2px}
.msg pre,.msg code,.tools span,.pill{border-radius:3px}
.composer textarea,.send{border-radius:6px}
.bar,.bar i{border-radius:0}
#login .logo{border-radius:14px;box-shadow:0 0 0 1px var(--edge)}
.card-sheet{border-radius:8px 8px 0 0}.as-g,.as-btn.cancel,.alert{border-radius:8px}
@media (min-width:700px){.card-sheet{border-radius:8px}}

/* portable (≥ 900 px) : barre latérale, contenu élargi, colonnes */
.side-brand,.side-foot,.desk{display:none}
.cell.sel{background:var(--fill)}
.dcol.l>.hdr:first-child{margin-top:22px}
@media (min-width:900px){
  .tabbar{top:0;bottom:0;right:auto;width:240px;flex-direction:column;gap:4px;padding:24px 14px;background:var(--card2);-webkit-backdrop-filter:none;backdrop-filter:none;
    border-top:0;border-right:.5px solid var(--sep);padding-inline:14px}
  .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 12px;border-radius:4px;font-size:15px;color:var(--label)}
  .tabbar button svg{width:20px;height:20px;color:var(--label2)}
  .tabbar button.on{background:var(--fill);color:var(--accent);font-weight:600}
  .tabbar button.on svg{color:var(--accent)}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-weight:700;font-size:19px}
  .side-brand img{width:34px;height:34px;border-radius:6px}
  .side-foot{display:block;margin-top:auto;padding:12px}
  .desk{display:block}
  #nav{margin-left:240px;padding-inline:max(32px,calc((100% - 240px - 1120px) / 2))}
  main{margin-left:240px;max-width:none;padding:0 40px 48px}
  main>section{max-width:1120px;margin:0 auto}
  .push{left:240px;padding-inline:max(0px,calc((100% - 240px - 1120px) / 2))}
  main .group,main .tiles,main .search,main .seg,main .actions{margin-left:0;margin-right:0}
  main .hdr,main .ftr{margin-left:16px;margin-right:16px}
  main .large{margin-left:0;margin-right:0}
  /* Serveur */
  #v-dash .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:8px}
  .dcol.l{grid-column:1;grid-row:1}.dcol.r{grid-column:2;grid-row:1}
  .dcol.r>.group:first-of-type{margin-top:0!important}
  /* Machines : liste à gauche, fiche à droite */
  .gsplit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:28px;align-items:start}
  #gPanel #sheet{position:sticky;top:52px;inset:auto;transform:none;transition:none;z-index:auto!important;max-height:calc(100vh - 72px);padding:4px 16px 0;
    background:var(--card);border-radius:6px;box-shadow:0 0 0 1px var(--edge),var(--soft)}
  #gPanel #sheet:empty{display:grid;place-items:center;min-height:300px;color:var(--label2);font-size:15px}
  #gPanel #sheet:empty::before{content:"Choisis une machine dans la liste"}
  #gPanel #gnav{display:none}
  #gPanel .large{margin-top:16px}
  #gPanel .group,#gPanel .tile,#gPanel .actions button{background:var(--bg);box-shadow:0 0 0 1px var(--edge)}
  /* Hermes */
  #v-chat{max-width:820px}
  #chat{padding:0 0 24px}
  .msg{max-width:70%}
  .composer{position:sticky;bottom:16px;left:auto;right:auto;border:.5px solid var(--sep);border-radius:6px}
  /* Apps */
  #v-apps .appgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:28px 12px;background:var(--card);padding:20px;border-radius:6px;box-shadow:0 0 0 1px var(--edge),var(--soft)}
  #v-apps .app .ai{width:84px;height:84px;border-radius:10px;font-size:34px}
  #v-apps .app .st{right:calc(50% - 48px);border-color:var(--card)}
  #v-apps .app .an{font-size:14px}
}

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { ov: null, view: "dash", filter: "all", guest: null, chat: [], pending: [], busy: false, execBusy: false };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- icônes
const I = {
  chev: '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>',

  disk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  net: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5"/></svg>',
  power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>',
  reboot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>',
  kill: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>',
  snap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  backup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4M12 4v11M8 11l4 4 4-4"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4" stroke-linecap="round"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5M12 17h7"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c5 0 9 3.4 9 7.6s-4 7.6-9 7.6c-.9 0-1.8-.1-2.6-.3L5 20.5l.9-3.9C4.1 15.2 3 13 3 10.6 3 6.4 7 3 12 3"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-6 6v3.6L4.3 15A1 1 0 0 0 5.2 16.5h13.6a1 1 0 0 0 .9-1.5L18 11.6V8a6 6 0 0 0-6-6m-2.5 16a2.5 2.5 0 0 0 5 0z"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5zM9 7a3 3 0 0 1 6 0"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  compose: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-3.8 1 1-3.8z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8-1.3-1.3a4 4 0 0 0-5-5L14 6z"/></svg>',
};
const icoBox = (svg, color) => `<span class="ico" style="background:var(--${color})">${svg}</span>`;

// ---------- formats
const fb = n => { n = +n || 0; const u = ["o","Ko","Mo","Go","To"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i < 2 ? n.toFixed(0) : n.toFixed(1)).replace(".", ",") + " " + u[i]; };
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;
const up = s => { s = +s || 0; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600); return d ? `${d} j ${h} h` : `${h} h ${Math.floor(s % 3600 / 60)} min`; };
const bar = p => `<div class="bar"><i class="${p > 90 ? "crit" : p > 75 ? "hi" : ""}" style="width:${p.toFixed(1)}%"></i></div>`;
const kind = t => t === "qemu" ? "VM" : "CT";
const STATUS = { running: "En marche", stopped: "Arrêtée", paused: "En pause", online: "En ligne", offline: "Hors ligne" };
const when = ts => new Date(ts * 1000).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// iOS : un 2e appui rapide au même endroit déclenche un zoom ; on l'annule (le pincement à deux doigts reste possible).
// touch-action:manipulation (CSS) suffit en principe, ceci couvre les cas où iOS l'ignore.
let lastTap = { t: 0, el: null };
document.addEventListener("touchend", e => {
  if (e.touches.length || e.changedTouches.length !== 1 || e.target.closest("input,textarea,select,[contenteditable]")) return;
  const now = Date.now();
  if (now - lastTap.t < 350 && lastTap.el === e.target) e.preventDefault();
  lastTap = { t: now, el: e.target };
}, { passive: false });

// ---------- api
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"),
    headers: { "Content-Type": "application/json" }, credentials: "same-origin",
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { showLogin(); throw new Error("Non connecté"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const qs = o => new URLSearchParams(o).toString();

// ---------- composants iOS
function toast(msg, ms = 3500) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), ms); return el;
}
// Feuille d'actions : resolve(index du bouton) ou -1
function actionSheet(title, msg, buttons) {
  return new Promise(res => {

// Suit une tâche Proxmox jusqu'à la fin ; renvoie "OK" ou le message d'erreur.
async function track(res, label) {
  const t = toast(`⏳ ${label}…`, 600000);
  try {
    for (let i = 0; i < 900; i++) {
      await new Promise(r => setTimeout(r, i < 5 ? 1000 : 2500));
      const s = await api("/api/task?" + qs({ node: res.node, upid: res.upid }));
      if (s.status === "stopped") {
        t.remove(); const ok = s.exitstatus === "OK";
        toast(`${ok ? "✅" : "❌"} ${label}${ok ? "" : " : " + s.exitstatus}`, 5000);
        refresh(); if (S.guest) loadGuestExtras();
        return s.exitstatus;
      }
    }
    t.remove(); return "toujours en cours";
  } catch (e) { t.remove(); toast("❌ " + e.message); return e.message; }
}

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chart(cv, rows, series, { max, fmt = v => v.toFixed(0) + " %" } = {}) {
  if (!cv || !cv.clientWidth) return;
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext("2d"); c.scale(dpr, dpr);
  rows = rows.filter(r => series.some(s => Number.isFinite(s.v(r))));
  if (rows.length < 2) { c.fillStyle = cssv("--label2"); c.font = "13px -apple-system,system-ui"; c.fillText("Pas encore de données", 0, h / 2); return; }
  const top = max ?? Math.max(1, ...rows.flatMap(r => series.map(s => s.v(r) || 0))) * 1.15;
  const pad = 4, x = i => i / (rows.length - 1) * w, y = v => h - pad - (Math.min(v, top) / top) * (h - pad - 14);
  c.strokeStyle = cssv("--sep"); c.lineWidth = .5;
  [0, .5, 1].forEach(f => { c.beginPath(); c.moveTo(0, y(top * f)); c.lineTo(w, y(top * f)); c.stroke(); });
  c.fillStyle = cssv("--label2"); c.font = "11px -apple-system,system-ui"; c.fillText(fmt(top), 0, 10);
  for (const s of series) {
    const col = cssv(s.color);
    c.beginPath(); c.strokeStyle = col; c.lineWidth = 2; c.lineJoin = "round";
    rows.forEach((r, i) => { const v = s.v(r) || 0; i ? c.lineTo(x(i), y(v)) : c.moveTo(x(i), y(v)); });
    c.stroke(); c.lineTo(w, h - pad); c.lineTo(0, h - pad); c.closePath();
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, col + "40"); g.addColorStop(1, col + "00");
    c.fillStyle = g; c.fill();
  }
}

        ${guests.map(g => `<label class="cell icon">${icoBox(g.type === "qemu" ? I.vm : I.ct, g.type === "qemu" ? "indigo" : "teal")}<div class="body"><div class="t ell">${esc(g.name || g.vmid)}</div><div class="s">${kind(g.type)} ${g.vmid}</div></div>
          <span class="sw"><input type="checkbox" data-g="${g.type}/${g.vmid}" ${sel.has(`${g.type}/${g.vmid}`) ? "checked" : ""} aria-label="${esc(g.name || g.vmid)}"><span></span></span></label>`).join("")}</div>

function describe(a) {
  const d = ACT[a.action], g = S.ov?.guests.find(x => x.vmid == a.vmid);
  const who = `${kind(a.type || g?.type)} ${a.vmid}${g?.name ? " « " + g.name + " »" : ""}`;
  return `${d?.label || a.action} ${who}${a.name ? (a.action === "snapshot" ? " « " + a.name + " »" : " (" + a.name + ")") : ""}`;
}
async function runAction(a, skipConfirm) {
  const d = ACT[a.action]; if (!d) { toast("Action inconnue : " + a.action); return null; }
  const g = S.ov?.guests.find(x => x.vmid == a.vmid);
  a = { node: g?.node, type: g?.type, ...a };
  if (!a.node || !a.type) { toast("Machine introuvable : " + a.vmid); return null; }
  const text = describe(a);
  if (!skipConfirm && !await confirmBox(esc(text) + " ?", d.warn ? esc(d.warn) : "", d.danger ? "Confirmer" : d.label, d.danger)) return null;
  try { return await track(await d.run(a), text); }
  catch (e) { toast("❌ " + e.message); return e.message; }
}

// ---------- tâches planifiées (crontab)
const DAYS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const DAYN = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
// Planification cron → français ; null si trop exotique (on affiche alors l'expression brute)
function cronFr(s) {
  const sp = { "@reboot": "Au démarrage", "@hourly": "Toutes les heures", "@daily": "Tous les jours à 00:00", "@midnight": "Tous les jours à 00:00",
    "@weekly": "Le dimanche à 00:00", "@monthly": "Le 1er du mois à 00:00", "@yearly": "Le 1er janvier à 00:00", "@annually": "Le 1er janvier à 00:00" }[s.toLowerCase()];
  if (sp) return sp;
  const [mi, h, dom, mon, dow] = s.split(" "), num = x => /^\d+$/.test(x);
  if (mon !== "*") return null;
  if (mi === "*" && h === "*" && dom === "*" && dow === "*") return "Chaque minute";
  let m = mi.match(/^\*\/(\d+)$/);
  if (m && h === "*" && dom === "*" && dow === "*") return `Toutes les ${m[1]} minutes`;
  if (num(mi) && h === "*" && dom === "*" && dow === "*") return `Toutes les heures à :${mi.padStart(2, "0")}`;
  if (num(mi) && (m = h.match(/^\*\/(\d+)$/)) && dom === "*" && dow === "*") return `Toutes les ${m[1]} heures à :${mi.padStart(2, "0")}`;
  if (!num(mi) || !num(h)) return null;
  const t = `${h.padStart(2, "0")}:${mi.padStart(2, "0")}`;
  if (dom === "*" && dow === "*") return `Tous les jours à ${t}`;
  const day = x => DAYS[num(x) ? +x : DAYN[x.toLowerCase()]];
  if (dom === "*") {
    if ((m = dow.match(/^(\w+)-(\w+)$/)) && day(m[1]) && day(m[2])) return `Du ${day(m[1])} au ${day(m[2])} à ${t}`;
    const ds = dow.split(",").map(day);
    if (ds.every(Boolean)) return `Le ${ds.join(", ").replace(/, ([^,]*)$/, " et $1")} à ${t}`;
    return null;
  }
  if (num(dom) && dow === "*") return `Le ${dom === "1" ? "1er" : dom} de chaque mois à ${t}`;
  return null;
}

const CRON_PRESETS = [["5min", "Toutes les 5 minutes"], ["hour", "Toutes les heures"], ["day", "Tous les jours"], ["week", "Chaque semaine"],

function cronEditor(job) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<form class="card-sheet"><div class="grab"></div>
    <div class="shead"><button type="button" class="navbtn" data-close style="width:84px">Annuler</button><h2>${job ? "Modifier" : "Nouvelle tâche"}</h2>
      <button class="navbtn" style="font-weight:600;width:84px;justify-content:flex-end">Enregistrer</button></div>

      <label class="cell" data-f="dom"><div class="body">Jour du mois</div><select name="dom" class="picker">${Array.from({ length: 28 }, (_, i) => `<option>${i + 1}</option>`).join("")}</select>${I.chev}</label>
      <label class="cell"><div class="body">Expression cron</div><input name="sched" class="picker" style="direction:ltr;font-family:var(--mono);max-width:55%" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="ftr" id="cronPreview"></div>

    <div class="ftr">Une seule ligne. Exécutée par root${cronTgt().type === "host" ? " sur l'hôte Proxmox" : " dans le conteneur"}.</div></form>`;
  const f = m.querySelector("form"), F = n => f.elements[n];

    const [hh, mm] = (F("time").value || "03:00").split(":").map(Number), p = F("preset").value;
    const x = { "5min": "*/5 * * * *", hour: "0 * * * *", day: `${mm} ${hh} * * *`, week: `${mm} ${hh} * * ${F("dow").value}`,
      month: `${mm} ${hh} ${F("dom").value} * *`, reboot: "@reboot" }[p];

  };

    const p = F("preset").value;

    f.querySelector("[data-f=dow]").classList.toggle("hide", p !== "week");
    f.querySelector("[data-f=dom]").classList.toggle("hide", p !== "month");
    const v = F("sched").value.trim().replace(/\s+/g, " ");
    f.querySelector("#cronPreview").textContent = v ? (cronFr(v) || "Expression personnalisée : " + v) : "";
  };
  // ouverture : on retrouve le préréglage qui correspond à la tâche existante
  if (job) {
    F("sched").value = job.sched; F("cmd").value = job.cmd; F("preset").value = "custom";
    const [mi, h, dom, , dow] = job.sched.split(" "), n = x => /^\d+$/.test(x || "");
    if (job.sched === "*/5 * * * *") F("preset").value = "5min";
    else if (job.sched === "0 * * * *") F("preset").value = "hour";
    else if (job.sched === "@reboot") F("preset").value = "reboot";
    else if (n(mi) && n(h)) {
      F("time").value = `${h.padStart(2, "0")}:${mi.padStart(2, "0")}`;
      if (dom === "*" && dow === "*") F("preset").value = "day";
      else if (dom === "*" && /^[0-6]$/.test(dow)) { F("preset").value = "week"; F("dow").value = dow; }
      else if (n(dom) && +dom <= 28 && dow === "*") { F("preset").value = "month"; F("dom").value = dom; }

// ---------- maintenance : sauvegardes + mises à jour des conteneurs
const ago = ts => { const s = Date.now() / 1000 - ts; return s < 3600 ? `il y a ${Math.max(1, Math.round(s / 60))} min` : s < 86400 ? `il y a ${Math.round(s / 3600)} h` : `il y a ${Math.round(s / 86400)} j`; };
const bkState = g => !g.last ? "none" : Date.now() / 1000 - g.last.ctime > 7 * 86400 ? "old" : "ok";
const DOW_PVE = { mon: "lundi", tue: "mardi", wed: "mercredi", thu: "jeudi", fri: "vendredi", sat: "samedi", sun: "dimanche" };
function scheduleFr(s) {  // format calendrier de Proxmox : « 01:00 », « sun 02:00 », « mon..fri 21:00 »…
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{1,2}):(\d{2})$/))) return `Tous les jours à ${m[1].padStart(2, "0")}:${m[2]}`;
  if ((m = s.match(/^([a-z]{3})\.\.([a-z]{3}) (\d{1,2}):(\d{2})$/)) && DOW_PVE[m[1]] && DOW_PVE[m[2]]) return `Du ${DOW_PVE[m[1]]} au ${DOW_PVE[m[2]]} à ${m[3].padStart(2, "0")}:${m[4]}`;
  if ((m = s.match(/^([a-z,]+) (\d{1,2}):(\d{2})$/)) && m[1].split(",").every(d => DOW_PVE[d])) return `Le ${m[1].split(",").map(d => DOW_PVE[d]).join(", ").replace(/, ([^,]*)$/, " et $1")} à ${m[2].padStart(2, "0")}:${m[3]}`;
  return s || "Planification inconnue";
}
async function loadMaint(refresh) {
  const [b, u, dk] = await Promise.allSettled([api("/api/maint/backups"), api("/api/maint/updates" + (refresh ? "?refresh=1" : "")),
    S.mD && !refresh && Date.now() - S.mDAt < 300000 ? Promise.resolve(S.mD) : api("/api/disks")]);  // SMART : pas plus d'une fois toutes les 5 min
  if (dk.status === "fulfilled" && dk.value !== S.mD) S.mDAt = Date.now();
  S.mD = dk.status === "fulfilled" ? dk.value : { error: dk.reason.message, disks: [] };
  S.mB = b.status === "fulfilled" ? b.value : { error: b.reason.message };
  S.mU = u.status === "fulfilled" ? u.value : { error: u.reason.message };
  S.mAt = Date.now();
  S.mJobs = S.mJobs || {};  // après un rechargement de page : on retrouve les mises à jour lancées côté serveur
  for (const j of Object.values(S.mU.jobs || {})) if (!S.mJobs[j.vmid] || S.mJobs[j.vmid].at <= j.at) S.mJobs[j.vmid] = j;
  const busy = Object.values(S.mJobs).some(j => ["start", "snapshot", "upgrade"].includes(j.status));
  if (S.view === "dash" && $("#maintBtn")) renderDash();
  if (S.maintOpen) renderMaint();
  clearTimeout(S.mPoll);  // pendant la recherche des mises à jour : on repasse toutes les 3 s
  if ((S.mU.scanning || busy) && S.maintOpen) S.mPoll = setTimeout(() => loadMaint(), 3000);
}
// même règle que le serveur (disk_problems) : panne SMART, usure ≥ 90 %, trop chaud
function diskState(d) {
  const lim = S.mD?.limits?.[d.type] ?? S.mD?.limits?.other ?? 70, failed = !["PASSED", "OK", "UNKNOWN", ""].includes(d.health);
  const hot = d.temp != null && d.temp >= lim, worn = d.wearout != null && d.wearout >= 90;
  return { failed, hot, worn, bad: failed || hot || worn };
}
const ctsToUpdate = () => (S.mU?.cts || []).filter(c => c.packages.length);
function maintSummary() {
  if (!S.mB && !S.mU) return "Sauvegardes et mises à jour";
  const parts = [], late = (S.mB?.guests || []).filter(g => bkState(g) !== "ok").length, upd = ctsToUpdate().length + (S.mU?.host?.packages?.length ? 1 : 0);
  if (S.mB && !S.mB.error && !S.mB.jobs.length) parts.push("aucune sauvegarde planifiée");
  if (late) parts.push(`${late} machine${late > 1 ? "s" : ""} sans sauvegarde récente`);
  if (S.mB?.failed?.length) parts.push("sauvegarde en échec");
  if (upd) parts.push(`${upd} machine${upd > 1 ? "s" : ""} à mettre à jour`);
  const dbad = (S.mD?.disks || []).filter(d => diskState(d).bad).length;
  if (dbad) parts.push(`${dbad} disque${dbad > 1 ? "s" : ""} à surveiller`);
  if (S.mU?.scanning && !upd) parts.push("recherche des mises à jour…");

async function upgradeCt(vmid, snapshot = true) {

  try { j = await api("/api/maint/upgrade", { body: { node: g.node, type: g.type, vmid, snapshot } }); }
  catch (e) { toast("❌ " + e.message); return; }
  S.mJobs[vmid] = { status: "start" }; renderMaint();
  for (;;) {  // suivi jusqu'à la fin
    await new Promise(r => setTimeout(r, 3000));
    try { S.mJobs[vmid] = await api("/api/maint/job?" + qs({ id: j.job })); } catch { continue; }
    if (S.maintOpen) renderMaint();
    if (["done", "error"].includes(S.mJobs[vmid].status)) break;
  }
  const r = S.mJobs[vmid];
  if (r.status === "done") toast(`✅ ${g.name || vmid} mis à jour`);
  else if (snapshot && /Snapshot impossible/.test(r.error || "")) {
    if (await confirmBox("Snapshot impossible", `Le stockage de ${esc(g.name || vmid)} ne permet pas les snapshots. Mettre à jour quand même, sans retour en arrière possible ?`, "Mettre à jour sans snapshot", true)) return upgradeCt(vmid, false);

// ---------- rapport du matin
async function reportNow() {
  let r; try { r = await api("/api/report/now", { body: {} }); } catch (e) { return toast("❌ " + e.message); }
  const t = toast(S.ov?.hermes ? "⏳ Hermes rédige le rapport…" : "⏳ Préparation du rapport…", 600000);
  for (let i = 0; i < 100; i++) {  // jusqu'à 5 min : Hermes peut prendre son temps
    await new Promise(res => setTimeout(res, 3000));
    try { const rep = (await api("/api/reports")).reports.find(x => x.ts >= r.started); if (rep) { t.remove(); return openReport(rep); } } catch {}
  }
  t.remove(); toast("Le rapport n'est pas arrivé : regarde le journal de PVE Hub.", 7000);
}

function openReport(rep) {

  if (!S.ov?.hermes) return showPackages("Rapport du matin", rep.text.split("\n"));

async function copyText(t) {

const CHOICE = { once: "Autoriser", session: "Pour la session", always: "Toujours", deny: "Refuser" };

function md(m) {
  const parts = m.content.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let out = "";
  for (let i = 0; i < parts.length; i += 3) {
    out += esc(parts[i]).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .replace(/^#{1,4} (.+)$/gm, "<b>$1</b>").replace(/^[-*] /gm, "• ").replace(/\n/g, "<br>");
    if (i + 2 >= parts.length) continue;
    const lang = parts[i + 1], code = parts[i + 2].trim();
    if (lang !== "pvehub") { out += `<pre>${esc(code)}</pre>`; continue; }
    let a; try { a = JSON.parse(code); } catch { out += m.typing ? `<div class="inline"><div class="is">Action en préparation…</div></div>` : ""; continue; }
    const done = m.done?.[code];
    out += `<div class="inline"><div class="it">${I.bolt.replace("<svg", '<svg width="16" height="16" style="color:var(--orange)"')}${esc(describe(a))}</div>
      ${done ? `<div class="done ${done === "OK" ? "" : "no"}">${done === "OK" ? "✓ Fait" : "✕ " + esc(done)}</div>`
        : m.typing ? "" : `<div class="ibtns"><button class="ibtn pri" data-act="${esc(code)}">Exécuter</button></div>`}</div>`;
  }
  return out;
}
function approvalsHtml(m) {

    ${ap.answer ? `<div class="done ${ap.answer === "deny" ? "no" : ""}">${ap.answer === "deny" ? "✕ Refusé" : "✓ " + esc(CHOICE[ap.answer] || ap.answer)}</div>`

async function send() {
  const text = $("#prompt").value.trim(); if (!text || S.busy) return;

  const content = (S.pending.length ? S.pending.join("\n") + "\n\n" : "") + text; S.pending = [];

  const reply = { role: "assistant", content: "", tools: [], approvals: [], typing: true }; S.chat.push(reply);
  S.busy = true; $("#sendBtn").disabled = true; renderChat(); scrollChat();
  const history = S.chat.filter(m => m !== reply && (m.role === "user" || m.role === "assistant") && (m.content || m.sent))
    .map(m => ({ role: m.role, content: m.sent || m.content }));

// Abonnement à une réponse suivie par le serveur ; rejoue tout depuis le début (reprise sans perte après fermeture)
S.following = new Map();  // runId -> AbortController
function stopFollowing() { for (const c of S.following.values()) c.abort(); S.following.clear(); }
async function followRun(reply, conv) {
  if (!reply.runId || S.following.has(reply.runId)) return;
  const ctl = new AbortController(); S.following.set(reply.runId, ctl);
  if (conv === S.conv) { S.busy = true; $("#sendBtn").disabled = true; }
  const answered = reply.approvals?.map(a => a.answer) || [];
  Object.assign(reply, { content: "", tools: [], approvals: [], typing: true });
  let last = 0, ended = false;
  const paint = force => { if (force || Date.now() - last > 80) { last = Date.now(); paintMsg(reply); } };
  try {
    const r = await fetch("/api/chat/stream?" + qs({ run: reply.runId }), { credentials: "same-origin", signal: ctl.signal });
    if (r.status === 401) { showLogin(); throw new Error("Non connecté"); }
    if (r.status === 404) {  // serveur redémarré : la réponse a peut-être été enregistrée avant
      const saved = (await api("/api/chats/get?" + qs({ id: conv.id })).catch(() => null))?.messages?.find(m => m.runId === reply.runId);
      if (saved && !saved.typing) Object.assign(reply, saved); else reply.content = "⚠️ Réponse interrompue (PVE Hub a redémarré). Repose ta question.";
      ended = true;
    } else {
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      while (!ended) {
        const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trimStart()).join("\n");
          if (!data) continue;
          let j; try { j = JSON.parse(data); } catch { continue; }
          switch (j.event) {
            case "message.delta": reply.content += j.delta || ""; break;
            case "tool.started": if (j.tool && !reply.tools.includes(j.tool)) reply.tools.push(j.tool); break;
            case "approval.request": {
              const ap = { command: j.command, description: j.description, choices: j.choices, request_id: j.request_id, answer: answered[reply.approvals.length] };
              reply.approvals.push(ap); paint(true); scrollChat(); if (!ap.answer && document.visibilityState === "visible") toast("🛡️ Hermes demande une autorisation"); break;
            }
            case "approval.responded": { const p = reply.approvals.find(a => !a.answer); if (p) p.answer = j.choice; break; }
            case "run.completed": if (j.output) reply.content = j.output; break;
            case "run.failed": case "run.interrupted": reply.content += (reply.content ? "\n\n" : "") + "⚠️ " + (j.error || "Hermes a échoué"); break;
            case "run.cancelled": reply.content += (reply.content ? "\n\n" : "") + "_(annulé)_"; break;
            case "pvehub.end": ended = true; break;
          }
          paint();
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") { reply.content += (reply.content ? "\n\n" : "") + "⚠️ " + e.message; ended = true; }
  }
  if (S.following.get(reply.runId) === ctl) S.following.delete(reply.runId);
  if (!ended) return;  // app passée en arrière-plan : le serveur continue, on se raccrochera au retour
  reply.typing = false; paint(true); saveChat(conv);
  if (conv === S.conv) { S.busy = false; $("#sendBtn").disabled = false; }
  autoRun(reply);
}

  checkVersion(); loadMaint(); maybeShowChanges(); setInterval(() => document.visibilityState === "visible" && loadMaint(), 300000);
  setInterval(() => document.visibilityState === "visible" && checkVersion(), 3600000);  // lit le cache du serveur, GitHub n'est interrogé qu'une fois par semaine
}
